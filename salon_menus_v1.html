<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TORITA - メニュー設定</title>
<!--
  C-5 メニュー設定画面 v1（DESIGN.md 0-2 メニュースキーマ / 3-3 menusルール準拠）
  機能:
    - メニュー一覧（dbSalonListMenus、sortOrder順、公開/非公開バッジ）
    - 新規追加（dbSalonCreateMenu）
    - 編集（dbSalonUpdateMenu）
    - 削除（dbSalonDeleteMenu。注意喚起あり）
    - 並び替え（▲▼ボタンで sortOrder 更新、dbSalonReorderMenus）
    - ★2026/6/12 カテゴリ（facial/body/other、mainのみ）と複製ボタンを追加
    - ★2026/6/13 メイン一覧をカテゴリ別グループ表示に変更（▲▼はカテゴリ内で完結）
  フェーズ1方針 (DESIGN.md 0-2):
    - 「施術可能スタッフ」「必要設備」UIは出さない（自動で['owner']/['default']）
    - public/非公開トグル、main/option タイプは設定する
  ロード順序:
    firebase-*-compat → firebase-init.js → shared_db.js → shared_auth.js → shared_ui.js
  ES5 互換: var/function のみ
-->
<style>
  :root{
    --ac:#b5845a; --al:#f5ede4; --ad:#7a5535;
    --bg:#fff; --sf:#f8f7f4; --s2:#f0ede8;
    --bd:rgba(0,0,0,.10); --tx:#1a1a18; --mu:#73726c;
    --gn:#7b9e87; --gl:#eef3ef;
    --rd:#c47b7b; --rl:#faeaea; --rt:#6b1f1f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Georgia','Hiragino Mincho ProN',serif;
    background:var(--s2); color:var(--tx);
    -webkit-text-size-adjust:100%; min-height:100vh;
  }

  .topbar{
    background:#fff; border-bottom:1px solid var(--bd);
    padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:10;
  }
  .back-link{
    background:none; border:none; cursor:pointer;
    font-family:inherit; font-size:13px; color:var(--mu);
    display:flex; align-items:center; gap:5px;
  }
  .back-link:hover{color:var(--ac);}
  .topbar-title{
    font-size:15px; font-weight:600; color:var(--ad);
    letter-spacing:.03em;
  }
  .topbar-spacer{width:60px;}

  .wrap{max-width:680px; margin:0 auto; padding:18px 14px 40px;}

  .toolbar{
    display:flex; gap:9px; margin-bottom:14px;
    justify-content:flex-end;
  }
  .btn-add{
    background:var(--ac); color:#fff; border:none;
    border-radius:11px; padding:10px 20px; cursor:pointer;
    font-family:inherit; font-size:14px; font-weight:600;
  }
  .btn-add:hover{background:var(--ad);}
  /* ★ カテゴリ編集ボタン（副次アクション） */
  .btn-cat{
    background:#fff; color:var(--ad);
    border:1px solid var(--ac); border-radius:11px;
    padding:10px 16px; cursor:pointer;
    font-family:inherit; font-size:14px; font-weight:600;
  }
  .btn-cat:hover{background:var(--al);}
  /* ★ カテゴリ編集モーダルの行 */
  .cat-edit-row{
    display:flex; align-items:center; gap:8px;
    padding:8px 0; border-bottom:1px solid var(--bd);
  }
  .cat-edit-row:last-child{border-bottom:none;}
  .cat-edit-row .cat-name-in{
    flex:1; min-width:0; background:var(--sf);
    border:1px solid var(--bd); border-radius:8px;
    padding:9px 10px; font-family:inherit; font-size:14px; color:var(--tx);
  }
  .cat-edit-row .cat-name-in:focus{outline:none; border-color:var(--ac); background:#fff;}
  .cat-mini{
    width:30px; height:30px; border-radius:7px;
    border:1px solid var(--bd); background:var(--sf);
    cursor:pointer; font-family:inherit; line-height:1;
    color:var(--ad); font-size:13px; flex-shrink:0;
  }
  .cat-mini:hover:not(:disabled){background:var(--al); border-color:var(--ac);}
  .cat-mini:disabled{opacity:.35; cursor:not-allowed;}
  .cat-mini.del{color:var(--rt); border-color:var(--rl);}
  .cat-mini.del:hover{background:var(--rl);}
  .cat-add-row{display:flex; gap:8px; margin-top:14px;}
  .cat-add-row input{
    flex:1; background:var(--sf); border:1px solid var(--bd);
    border-radius:8px; padding:10px 12px;
    font-family:inherit; font-size:14px; color:var(--tx);
  }
  .cat-add-row input:focus{outline:none; border-color:var(--ac); background:#fff;}
  .cat-add-row button{
    flex:0 0 auto; background:var(--ac); color:#fff; border:none;
    border-radius:8px; padding:10px 16px; cursor:pointer;
    font-family:inherit; font-size:14px; font-weight:600;
  }
  .cat-add-row button:hover{background:var(--ad);}

  /* ★ 画像取り込み 確認モーダル */
  .imp-bulk{
    background:#fff; border:1px solid var(--bd);
    border-radius:10px; padding:12px 14px; margin-bottom:14px;
  }
  .imp-grid{display:flex; gap:8px; flex-wrap:wrap;}
  .imp-grid .field{flex:1; min-width:120px; margin-bottom:8px;}
  .imp-item{
    border:1px solid var(--bd); border-radius:10px;
    padding:12px 14px; margin-bottom:12px; background:var(--sf);
  }
  .imp-item.off{opacity:.45;}
  .imp-item-head{display:flex; align-items:center; gap:9px; margin-bottom:9px;}
  .imp-item-head input[type=checkbox]{
    width:18px; height:18px; accent-color:var(--ac); flex-shrink:0; cursor:pointer;
  }
  .imp-name{
    flex:1; min-width:0; background:#fff;
    border:1px solid var(--bd); border-radius:8px;
    padding:9px 10px; font-family:inherit; font-size:14px;
    font-weight:600; color:var(--tx);
  }
  .imp-name:focus{outline:none; border-color:var(--ac);}

  /* セクション見出し */
  .sec-head{
    font-size:13px; color:var(--ad); margin:18px 4px 8px;
    letter-spacing:.05em;
  }

  /* ★ カテゴリ小見出し（メインメニュー内のグループ） */
  .cat-head{
    font-size:12px; color:var(--mu); margin:14px 6px 6px;
    letter-spacing:.06em; font-weight:600;
  }

  /* メニュー一覧 */
  .menu-list{
    background:#fff; border-radius:13px;
    box-shadow:0 4px 16px rgba(0,0,0,.07);
    overflow:hidden;
  }
  .menu-row{
    display:flex; align-items:center; gap:10px;
    padding:14px 14px; border-bottom:1px solid var(--bd);
  }
  .menu-row:last-child{border-bottom:none;}
  .menu-main{flex:1; min-width:0; cursor:pointer;}
  .menu-main:hover .menu-name{color:var(--ac);}
  .menu-name{font-size:15px; font-weight:600; color:var(--tx);}
  .menu-sub{font-size:12px; color:var(--mu); margin-top:3px;}
  .menu-badges{
    display:flex; gap:5px; flex-wrap:wrap;
    margin-top:5px;
  }
  .badge{
    font-size:11px; padding:2px 7px; border-radius:6px;
    background:var(--al); color:var(--ad);
  }
  .badge.priv{background:var(--rl); color:var(--rt);}
  .badge.opt{background:var(--gl); color:var(--gn);}

  /* 並び替えボタン */
  .reorder{
    display:flex; flex-direction:column; gap:4px;
    flex-shrink:0;
  }
  .rb{
    width:30px; height:24px; border-radius:6px;
    border:1px solid var(--bd); background:var(--sf);
    cursor:pointer; font-family:inherit; line-height:1;
    color:var(--ad); font-size:13px;
  }
  .rb:hover:not(:disabled){background:var(--al); border-color:var(--ac);}
  .rb:disabled{opacity:.35; cursor:not-allowed;}

  .empty{
    text-align:center; color:var(--mu);
    padding:48px 20px; font-size:14px;
  }

  /* パネル（C-4 と同じ構造） */
  .panel-ov{
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,.42); z-index:50;
    overflow-y:auto; padding:24px 12px;
  }
  .panel-ov.show{display:block;}
  .panel{
    max-width:560px; margin:0 auto;
    background:#fff; border-radius:15px;
    box-shadow:0 12px 40px rgba(0,0,0,.22);
    overflow:hidden;
  }
  .panel-head{
    background:var(--al); padding:18px 20px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .panel-head h2{font-size:17px; color:var(--ad); font-weight:600;}
  .panel-close{
    background:none; border:none; cursor:pointer;
    font-size:22px; color:var(--mu); line-height:1;
  }
  .panel-body{padding:20px;}

  .field{margin-bottom:16px;}
  .field label{
    display:block; font-size:12px; color:var(--mu);
    margin-bottom:5px; letter-spacing:.02em;
  }
  .field input, .field textarea, .field select{
    width:100%; background:var(--sf);
    border:1px solid var(--bd); border-radius:9px;
    padding:10px 12px; font-family:inherit;
    font-size:14px; color:var(--tx);
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none; border-color:var(--ac); background:#fff;
  }
  .field textarea{resize:vertical; min-height:60px;}
  .row-2{display:flex; gap:10px;}
  .row-2 .field{flex:1;}

  /* スイッチ風（公開/非公開トグル） */
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--sf); border:1px solid var(--bd);
    border-radius:9px; padding:10px 12px;
  }
  .toggle-row .label{font-size:14px; color:var(--tx);}
  .toggle-row .sub{font-size:11px; color:var(--mu); margin-top:2px;}
  .toggle-row .left{flex:1; min-width:0;}
  .tg{
    position:relative; width:46px; height:26px;
    background:var(--bd); border-radius:13px;
    cursor:pointer; flex-shrink:0;
    transition:background .15s;
  }
  .tg.on{background:var(--ac);}
  .tg::after{
    content:''; position:absolute; left:3px; top:3px;
    width:20px; height:20px; background:#fff;
    border-radius:50%; transition:left .15s;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  .tg.on::after{left:23px;}

  .panel-actions{
    display:flex; gap:10px; padding:16px 20px;
    border-top:1px solid var(--bd); background:var(--sf);
  }
  .btn{
    flex:1; border:none; border-radius:10px;
    padding:12px; cursor:pointer;
    font-family:inherit; font-size:14px; font-weight:600;
  }
  .btn-primary{background:var(--ac); color:#fff;}
  .btn-primary:hover{background:var(--ad);}
  .btn-ghost{background:var(--s2); color:var(--mu);}
  .btn-ghost:hover{background:var(--bd);}
  .btn-danger{
    background:var(--rl); color:var(--rt);
    flex:0 0 auto; padding:12px 16px;
  }
  .btn-danger:hover{background:#f3d9d9;}

  .form-note{
    font-size:12px; color:var(--mu);
    background:var(--sf); border-radius:8px;
    padding:10px 12px; margin-bottom:16px; line-height:1.6;
  }

  /* ===== Phase2: staff/space/equipment check UI ===== */
  .team-section{
    border:1px solid var(--bd); border-radius:10px;
    padding:12px 14px; margin-bottom:16px; background:var(--sf);
  }
  .team-section-title{
    font-size:12px; font-weight:600; color:var(--ac);
    letter-spacing:.04em; margin-bottom:10px;
  }
  .check-list{ display:flex; flex-direction:column; gap:7px; }
  .check-item{
    display:flex; align-items:center; gap:8px;
    cursor:pointer; font-size:13px; color:var(--tx);
  }
  .check-item input[type=checkbox]{
    width:16px; height:16px; accent-color:var(--ac);
    flex-shrink:0; cursor:pointer;
  }
  .check-empty{ font-size:12px; color:var(--mu); font-style:italic; }
  .team-note{ font-size:11px; color:var(--mu); margin-top:8px; line-height:1.5; }
</style>
</head>
<body>

<div class="topbar">
  <button class="back-link" onclick="goDashboard()">&#8592; 戻る</button>
  <div class="topbar-title">メニュー設定</div>
  <div class="topbar-spacer"></div>
</div>

<div class="wrap">
  <div class="toolbar">
    <button class="btn-cat" onclick="openImportPicker()">画像から取り込み</button>
    <button class="btn-cat" onclick="openCatEditor()">カテゴリ編集</button>
    <button class="btn-add" onclick="openCreate()">＋ メニューを追加</button>
  </div>
  <input type="file" id="importFileIn" accept="image/*" multiple style="display:none">

  <div class="sec-head">メインメニュー</div>
  <div id="mainList">
    <div class="menu-list"><div class="empty">読み込み中...</div></div>
  </div>

  <div class="sec-head">オプションメニュー</div>
  <div class="menu-list" id="optList">
    <div class="empty">読み込み中...</div>
  </div>
</div>

<div class="panel-ov" id="panelOv">
  <div class="panel">
    <div class="panel-head">
      <h2 id="panelTitle">メニュー</h2>
      <button class="panel-close" onclick="closePanel()">&#215;</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
    <div class="panel-actions" id="panelActions"></div>
  </div>
</div>

<!-- ★2026/9 カテゴリ編集モーダル -->
<div class="panel-ov" id="catPanelOv">
  <div class="panel">
    <div class="panel-head">
      <h2>カテゴリ編集</h2>
      <button class="panel-close" onclick="closeCatEditor()">&#215;</button>
    </div>
    <div class="panel-body" id="catPanelBody"></div>
    <div class="panel-actions">
      <button class="btn btn-primary" onclick="saveCatEditor()">保存</button>
      <button class="btn btn-ghost" onclick="closeCatEditor()">キャンセル</button>
    </div>
  </div>
</div>

<!-- ★2026/9 画像から取り込み 確認モーダル -->
<div class="panel-ov" id="importPanelOv">
  <div class="panel">
    <div class="panel-head">
      <h2>画像から取り込み</h2>
      <button class="panel-close" onclick="closeImport()">&#215;</button>
    </div>
    <div class="panel-body" id="importBody"></div>
    <div class="panel-actions">
      <button class="btn btn-primary" onclick="doImport()">取り込む</button>
      <button class="btn btn-ghost" onclick="closeImport()">キャンセル</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>

<script src="firebase-init.js"></script>
<script src="shared_db.js"></script>
<script src="shared_auth.js"></script>
<script src="shared_ui.js"></script>

<script>
(function () {

  var _all = [];          // 全メニュー（sortOrder昇順）
  var _mode = '';         // 'view' | 'edit' | 'create'
  var _curId = null;
  var _formPublic = true; // フォーム中の公開トグル状態
  var _salonId = null;    // Phase2
  var _planId = 'solo';   // Phase2: 'solo'|'team'
  var _staffList = [];    // Phase2: スタッフ一覧
  var _spaceList = [];    // Phase2: 場所一覧
  var _equipList = [];    // Phase2: 機器一覧

  // ★2026/9 サロン定義カテゴリ
  var _cats = [];         // 編集可能カテゴリ [{id,name}]（'other' は含めない）
  var _catsEdit = [];     // カテゴリ編集モーダルの作業コピー
  var _catsOrigIds = [];  // モーダルを開いた時点のID一覧（削除検出用）
  var OTHER_CAT = { id: 'other', label: 'その他 / 未分類' };

  function _catExists(id) {
    var i;
    for (i = 0; i < _cats.length; i++) {
      if (_cats[i].id === id) { return true; }
    }
    return false;
  }
  function _genCatId() {
    return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function esc(s) {
    s = (s == null) ? '' : String(s);
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function _v(id) {
    var el = document.getElementById(id);
    return el ? String(el.value || '').trim() : '';
  }
  function _vint(id, fallback) {
    var s = _v(id);
    if (s === '') { return fallback; }
    var n = parseInt(s, 10);
    return (isNaN(n) || n < 0) ? fallback : n;
  }
  function goDashboard() {
    window.location.href = 'salon_dashboard_v1.html';
  }
  window.goDashboard = goDashboard;

  // ----- 一覧 -----
  // ★2026/9: カテゴリ定義を先に取得してから本体をロード
  function loadList() {
    uiShowLoading('読み込み中...');
    dbSalonGetMenuCategories(function (cats) {
      _cats = cats || [];
      _loadListInner();
    });
  }

  function _loadListInner() {
    var db = firebase.firestore();
    db.collection('salons').doc(_salonId)
      .collection('config').doc('settings').get()
      .then(function (doc) {
        var d = doc.exists ? doc.data() : {};
        _planId = d.planId || 'solo';
        if (_planId !== 'team') { return loadMenusOnly(); }
        var p1 = db.collection('salons').doc(_salonId)
          .collection('staffs').orderBy('name', 'asc').get();
        var p2 = db.collection('salons').doc(_salonId)
          .collection('resources').orderBy('name', 'asc').get();
        return Promise.all([p1, p2]).then(function (results) {
          _staffList = [];
          results[0].forEach(function (sdoc) {
            if (sdoc.id === 'owner') { return; }
            _staffList.push({ id: sdoc.id, name: sdoc.data().name || sdoc.id });
          });
          _spaceList = []; _equipList = [];
          results[1].forEach(function (rdoc) {
            if (rdoc.id === 'default') { return; }
            var rd = rdoc.data();
            var item = { id: rdoc.id, name: rd.name || rdoc.id };
            if (rd.category === 'equipment') { _equipList.push(item); }
            else { _spaceList.push(item); }
          });
          return loadMenusOnly();
        });
      })
      .catch(function (e) {
        uiForceHideLoading();
        uiToast('読み込みに失敗しました: ' + e.message);
      });
  }

  function loadMenusOnly() {
    return new Promise(function (resolve) {
      dbSalonListMenus(function (list) {
        uiForceHideLoading();
        if (list == null) {
          uiToast('メニュー一覧の取得に失敗しました');
          renderAll([]);
        } else {
          _all = list;
          renderAll(_all);
        }
        resolve();
      });
    });
  }

  // ★ カテゴリ判定（現存カテゴリに一致しない/未設定は 'other' 扱い）
  function _catKey(m) {
    return (m && typeof m.category === 'string' && _catExists(m.category))
      ? m.category : 'other';
  }

  function renderAll(list) {
    var mains = [];
    var opts  = [];
    var i;
    for (i = 0; i < list.length; i++) {
      if (list[i] && list[i].type === 'option') {
        opts.push(list[i]);
      } else {
        mains.push(list[i]);
      }
    }
    renderMainGroups(document.getElementById('mainList'), mains);
    renderSection(document.getElementById('optList'),  opts,  'option');
  }

  // ★ メインメニューをカテゴリ別（フェイシャル/ボディ/その他）に
  //   小見出し付きでグループ表示。空のカテゴリは出さない。
  //   ▲▼並び替えはカテゴリ内に閉じる。
  function renderMainGroups(box, mains) {
    box.innerHTML = '';
    if (!mains || mains.length === 0) {
      var card0 = document.createElement('div');
      card0.className = 'menu-list';
      var em = document.createElement('div');
      em.className = 'empty';
      em.textContent = 'メインメニューはまだありません';
      card0.appendChild(em);
      box.appendChild(card0);
      return;
    }
    var defs = [];
    var d;
    for (d = 0; d < _cats.length; d++) {
      defs.push({ key: _cats[d].id, label: _cats[d].name });
    }
    defs.push({ key: 'other', label: OTHER_CAT.label });
    var g, i;
    for (g = 0; g < defs.length; g++) {
      var glist = [];
      for (i = 0; i < mains.length; i++) {
        if (_catKey(mains[i]) === defs[g].key) { glist.push(mains[i]); }
      }
      if (glist.length === 0) { continue; }
      var head = document.createElement('div');
      head.className = 'cat-head';
      head.textContent = defs[g].label;
      box.appendChild(head);
      var card = document.createElement('div');
      card.className = 'menu-list';
      for (i = 0; i < glist.length; i++) {
        card.appendChild(buildRow(glist[i], glist, i, defs[g].key));
      }
      box.appendChild(card);
    }
  }

  function renderSection(box, list, kind) {
    box.innerHTML = '';
    if (!list || list.length === 0) {
      var em = document.createElement('div');
      em.className = 'empty';
      em.textContent = (kind === 'option')
        ? 'オプションメニューはまだありません'
        : 'メインメニューはまだありません';
      box.appendChild(em);
      return;
    }
    var i;
    for (i = 0; i < list.length; i++) {
      box.appendChild(buildRow(list[i], list, i, kind));
    }
  }

  // ----- 並び替え -----
  // ★ kind は 'option' / 'facial' / 'body' / 'other' のいずれか（グループキー）。
  //   並び替えは同グループ内に閉じる。sortOrder はグループ内で 0..n-1 に振り直す
  //   （グループごとに独立して表示順を決めるので、グループ間で値が重複しても問題ない）。
  function moveItem(menuId, kind, dir) {
    var section = [];
    var i;
    for (i = 0; i < _all.length; i++) {
      var t;
      if (kind === 'option') {
        t = (_all[i].type === 'option') ? 'option' : '';
      } else {
        t = (_all[i].type === 'option') ? '' : _catKey(_all[i]);
      }
      if (t === kind) { section.push(_all[i]); }
    }
    // 現在位置
    var idx = -1;
    for (i = 0; i < section.length; i++) {
      if (section[i]._id === menuId) { idx = i; break; }
    }
    if (idx < 0) { return; }
    var newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= section.length) { return; }
    // 入れ替え
    var tmp = section[idx];
    section[idx] = section[newIdx];
    section[newIdx] = tmp;
    // sortOrder を 0..n-1 で振り直し
    var orderList = [];
    for (i = 0; i < section.length; i++) {
      orderList.push({ _id: section[i]._id, sortOrder: i });
      section[i].sortOrder = i;
    }

    // ローカル先行反映（楽観UIだが保存待ち中も操作ロック）
    uiShowLoading('並び替え中...');
    dbSalonReorderMenus(orderList, function (ok) {
      uiHideLoading();
      if (!ok) {
        uiToast('並び替えの保存に失敗しました');
        // 失敗時は再取得で実体に合わせる
        loadList();
        return;
      }
      // _all をローカルでも再ソート
      _all.sort(function (a, b) {
        var at = (a.type === 'option') ? 1 : 0;
        var bt = (b.type === 'option') ? 1 : 0;
        if (at !== bt) { return at - bt; }
        var ao = (typeof a.sortOrder === 'number') ? a.sortOrder : 999999;
        var bo = (typeof b.sortOrder === 'number') ? b.sortOrder : 999999;
        return ao - bo;
      });
      renderAll(_all);
    });
  }

  function saveEdit() {
    var name = _v('fName');
    if (!name) { uiToast('メニュー名は必須です'); return; }
    var dur = _vint('fDur', -1);
    if (dur <= 0) { uiToast('施術時間（分）は1以上を入れてください'); return; }
    var pr = _vint('fPrice', 0);
    var sel = document.getElementById('fType');
    var typ = (sel && sel.value === 'option') ? 'option' : 'main';
    // ★ カテゴリ（mainのみ。optionのときは送らない＝既存値はそのまま）
    var catSel = document.getElementById('fCat');
    var cat = (typ === 'main' && catSel) ? catSel.value : null;
    if (cat !== 'other' && !_catExists(cat)) { cat = null; }

    var patch = {
      name: name,
      duration: dur,
      price: pr,
      type: typ,
      public: _formPublic,
      description: _v('fDesc'),
      contraindications: _v('fContra')
    };
    if (cat) { patch.category = cat; }
    if (_planId === 'team') {
      patch.eligibleStaffIds     = _getChecked('fStaff', _staffList);
      patch.eligibleSpaceIds     = _getChecked('fSpace', _spaceList);
      patch.eligibleEquipmentIds = _getChecked('fEquip', _equipList);
    }

    uiShowLoading('保存中...');
    dbSalonUpdateMenu(_curId, patch, function (ok) {
      uiHideLoading();
      if (!ok) { uiToast('保存に失敗しました'); return; }
      uiToast('保存しました');
      // ローカル更新
      var i;
      for (i = 0; i < _all.length; i++) {
        if (_all[i]._id === _curId) {
          _all[i].name = patch.name;
          _all[i].duration = patch.duration;
          _all[i].price = patch.price;
          _all[i].type = patch.type;
          _all[i].public = patch.public;
          _all[i].description = patch.description;
          _all[i].contraindications = patch.contraindications;
          if (patch.category) { _all[i].category = patch.category; }
          // Phase I-step6: eligible フィールドをローカルにも反映
          if (_planId === 'team') {
            _all[i].eligibleStaffIds     = patch.eligibleStaffIds     || [];
            _all[i].eligibleSpaceIds     = patch.eligibleSpaceIds     || [];
            _all[i].eligibleEquipmentIds = patch.eligibleEquipmentIds || [];
          }
          break;
        }
      }
      openDetail(_curId);
      renderAll(_all);
    });

  function doCreate() {
    var name = _v('fName');
    if (!name) { uiToast('メニュー名は必須です'); return; }
    var dur = _vint('fDur', -1);
    if (dur <= 0) { uiToast('施術時間（分）は1以上を入れてください'); return; }
    var pr = _vint('fPrice', 0);
    var sel = document.getElementById('fType');
    var typ = (sel && sel.value === 'option') ? 'option' : 'main';
    // ★ カテゴリ（mainのみ）
    var catSel = document.getElementById('fCat');
    var cat = (typ === 'main' && catSel) ? catSel.value : null;
    if (cat !== 'other' && !_catExists(cat)) { cat = null; }
    // 新規は同種別の末尾に配置（既存の最大 sortOrder + 1）
    var maxSo = -1;
    var i;
    for (i = 0; i < _all.length; i++) {
      var t = (_all[i].type === 'option') ? 'option' : 'main';
      if (t !== typ) { continue; }
      var so = (typeof _all[i].sortOrder === 'number')
        ? _all[i].sortOrder : -1;
      if (so > maxSo) { maxSo = so; }
    }
    var data = {
      name: name,
      duration: dur,
      price: pr,
      type: typ,
      public: _formPublic,
      description: _v('fDesc'),
      contraindications: _v('fContra'),
      sortOrder: maxSo + 1
    };
    if (cat) { data.category = cat; }
    if (_planId === 'team') {
      data.eligibleStaffIds     = _getChecked('fStaff', _staffList);
      data.eligibleSpaceIds     = _getChecked('fSpace', _spaceList);
      data.eligibleEquipmentIds = _getChecked('fEquip', _equipList);
    }

    uiShowLoading('追加中...');
    dbSalonCreateMenu(data, function (res) {
      uiHideLoading();
      if (res == null || !res._id) {
        uiToast('追加に失敗しました');
        return;
      }
      uiToast('追加しました');
      var newM = {
        _id: res._id,
        name: data.name,
        duration: data.duration,
        price: data.price,
        type: data.type,
        category: data.category,
        public: data.public,
        description: data.description,
        contraindications: data.contraindications,
        sortOrder: data.sortOrder,
        eligibleStaffIds:     data.eligibleStaffIds     || ['owner'],
        eligibleSpaceIds:     data.eligibleSpaceIds     || [],
        eligibleEquipmentIds: data.eligibleEquipmentIds || []
      };
      _all.push(newM);
      _all.sort(function (a, b) {
        var at = (a.type === 'option') ? 1 : 0;
        var bt = (b.type === 'option') ? 1 : 0;
        if (at !== bt) { return at - bt; }
        var ao = (typeof a.sortOrder === 'number') ? a.sortOrder : 999999;
        var bo = (typeof b.sortOrder === 'number') ? b.sortOrder : 999999;
        return ao - bo;
      });
      closePanel();
      renderAll(_all);
    });
  }

  function _buildCheckSection(title, prefix, items, selectedIds, emptyMsg, noteMsg) {
    var sec = document.createElement('div');
    sec.className = 'team-section';
    var ttl = document.createElement('div');
    ttl.className = 'team-section-title';
    ttl.textContent = title;
    sec.appendChild(ttl);
    var list = document.createElement('div');
    list.className = 'check-list';
    if (items.length === 0) {
      var em = document.createElement('div');
      em.className = 'check-empty';
      em.textContent = emptyMsg;
      list.appendChild(em);
    } else {
      for (var i = 0; i < items.length; i++) {
        (function (item) {
          var lbl = document.createElement('label');
          lbl.className = 'check-item';
          var cb = document.createElement('input');
          cb.type = 'checkbox'; cb.id = prefix + '_' + item.id; cb.value = item.id;
          for (var j = 0; j < selectedIds.length; j++) {
            if (selectedIds[j] === item.id) { cb.checked = true; break; }
          }
          lbl.appendChild(cb);
          var sp = document.createElement('span');
          sp.textContent = item.name;
          lbl.appendChild(sp);
          list.appendChild(lbl);
        })(items[i]);
      }
    }
    sec.appendChild(list);
    if (noteMsg) {
      var note = document.createElement('div');
      note.className = 'team-note'; note.textContent = noteMsg;
      sec.appendChild(note);
    }
    return sec;
  }

  function _getChecked(prefix, items) {
    var result = [];
    for (var i = 0; i < items.length; i++) {
      var cb = document.getElementById(prefix + '_' + items[i].id);
      if (cb && cb.checked) { result.push(items[i].id); }
    }
    return result;
  }

  function _inField(label, id, val, type) {
    var f = document.createElement('div');
    f.className = 'field';
    var l = document.createElement('label');
    l.textContent = label;
    f.appendChild(l);
    var inp = document.createElement('input');
    inp.type = type || 'text';
    inp.id = id;
    inp.value = (val == null) ? '' : val;
    if (type === 'number') { inp.inputMode = 'numeric'; }
    f.appendChild(inp);
    return f;
  }
  function _taField(label, id, val) {
    var f = document.createElement('div');
    f.className = 'field';
    var l = document.createElement('label');
    l.textContent = label;
    f.appendChild(l);
    var ta = document.createElement('textarea');
    ta.id = id;
    ta.value = (val == null) ? '' : val;
    f.appendChild(ta);
    return f;
  }

  function showPanel() {
    document.getElementById('panelOv').className = 'panel-ov show';
  }
  function closePanel() {
    document.getElementById('panelOv').className = 'panel-ov';
    _mode = '';
    _curId = null;
  }
  window.closePanel = closePanel;

  document.getElementById('panelOv').onclick = function (e) {
    if (e.target === this) { closePanel(); }
  };

  // ============================================================
  // ★2026/9 カテゴリ編集モーダル
  // ============================================================
  function openCatEditor() {
    // 作業コピーを作成（保存するまで実体には反映しない）
    _catsEdit = [];
    _catsOrigIds = [];
    var i;
    for (i = 0; i < _cats.length; i++) {
      _catsEdit.push({ id: _cats[i].id, name: _cats[i].name });
      _catsOrigIds.push(_cats[i].id);
    }
    renderCatEditor();
    document.getElementById('catPanelOv').className = 'panel-ov show';
  }
  window.openCatEditor = openCatEditor;

  function closeCatEditor() {
    document.getElementById('catPanelOv').className = 'panel-ov';
  }
  window.closeCatEditor = closeCatEditor;

  // 現在の入力欄の名前を作業コピーへ取り込む（再描画・構造変更の前に呼ぶ）
  function _syncCatNamesFromDom() {
    var i;
    for (i = 0; i < _catsEdit.length; i++) {
      var el = document.getElementById('catNameIn_' + i);
      if (el) { _catsEdit[i].name = String(el.value || ''); }
    }
  }

  // このカテゴリに属するメイン メニュー数（実体 _all から数える）
  function _countMenusInCat(catId) {
    var n = 0, i;
    for (i = 0; i < _all.length; i++) {
      var m = _all[i];
      if (m && m.type !== 'option' && m.category === catId) { n++; }
    }
    return n;
  }

  function renderCatEditor() {
    var body = document.getElementById('catPanelBody');
    body.innerHTML = '';

    var note = document.createElement('div');
    note.className = 'form-note';
    note.textContent =
      'メインメニューを分類するカテゴリです（顧客の予約画面の見出しにも使われます）。'
      + '「その他 / 未分類」は常に用意されるため、ここには表示されません。'
      + 'カテゴリを削除すると、そのメニューは「その他 / 未分類」へ移動します。';
    body.appendChild(note);

    if (_catsEdit.length === 0) {
      var em = document.createElement('div');
      em.className = 'empty';
      em.textContent = 'カテゴリがありません。下から追加してください。';
      body.appendChild(em);
    }

    var i;
    for (i = 0; i < _catsEdit.length; i++) {
      (function (idx) {
        var row = document.createElement('div');
        row.className = 'cat-edit-row';

        var up = document.createElement('button');
        up.className = 'cat-mini';
        up.textContent = '\u25B2';
        if (idx === 0) { up.disabled = true; }
        up.onclick = function () { _moveCatRow(idx, -1); };
        row.appendChild(up);

        var dn = document.createElement('button');
        dn.className = 'cat-mini';
        dn.textContent = '\u25BC';
        if (idx === _catsEdit.length - 1) { dn.disabled = true; }
        dn.onclick = function () { _moveCatRow(idx, +1); };
        row.appendChild(dn);

        var inp = document.createElement('input');
        inp.className = 'cat-name-in';
        inp.id = 'catNameIn_' + idx;
        inp.type = 'text';
        inp.value = _catsEdit[idx].name;
        inp.maxLength = 30;
        row.appendChild(inp);

        var del = document.createElement('button');
        del.className = 'cat-mini del';
        del.textContent = '\u2715';
        del.onclick = function () { _delCatRow(idx); };
        row.appendChild(del);

        body.appendChild(row);
      })(i);
    }

    var addRow = document.createElement('div');
    addRow.className = 'cat-add-row';
    var addIn = document.createElement('input');
    addIn.type = 'text';
    addIn.id = 'catAddIn';
    addIn.placeholder = '新しいカテゴリ名';
    addIn.maxLength = 30;
    addRow.appendChild(addIn);
    var addBtn = document.createElement('button');
    addBtn.textContent = '＋ 追加';
    addBtn.onclick = _addCatRow;
    addRow.appendChild(addBtn);
    body.appendChild(addRow);
  }

  function _moveCatRow(idx, dir) {
    _syncCatNamesFromDom();
    var newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= _catsEdit.length) { return; }
    var tmp = _catsEdit[idx];
    _catsEdit[idx] = _catsEdit[newIdx];
    _catsEdit[newIdx] = tmp;
    renderCatEditor();
  }

  function _delCatRow(idx) {
    _syncCatNamesFromDom();
    _catsEdit.splice(idx, 1);
    renderCatEditor();
  }

  function _addCatRow() {
    _syncCatNamesFromDom();
    var el = document.getElementById('catAddIn');
    var name = el ? String(el.value || '').trim() : '';
    if (!name) { uiToast('カテゴリ名を入力してください'); return; }
    _catsEdit.push({ id: _genCatId(), name: name });
    renderCatEditor();
  }

  function saveCatEditor() {
    _syncCatNamesFromDom();

    // 名前を整形し、空欄を除外
    var cleaned = [];
    var i;
    for (i = 0; i < _catsEdit.length; i++) {
      var nm = String(_catsEdit[i].name || '').trim();
      if (nm) { cleaned.push({ id: _catsEdit[i].id, name: nm }); }
    }
    if (cleaned.length === 0) {
      uiToast('カテゴリは1つ以上必要です（すべて削除はできません）');
      return;
    }

    // 削除されたカテゴリID（開いた時点にあり、今はない）を検出
    var editedIds = {};
    for (i = 0; i < cleaned.length; i++) { editedIds[cleaned[i].id] = true; }
    var removedIds = [];
    for (i = 0; i < _catsOrigIds.length; i++) {
      if (!editedIds[_catsOrigIds[i]]) { removedIds.push(_catsOrigIds[i]); }
    }

    // 削除カテゴリに属するメニュー総数
    var affected = 0;
    for (i = 0; i < removedIds.length; i++) {
      affected += _countMenusInCat(removedIds[i]);
    }

    if (affected > 0) {
      uiConfirmDelete(
        affected + '件のメニューが「その他 / 未分類」へ移動します。'
        + '\nこのまま保存しますか？',
        function () { _doSaveCats(cleaned, removedIds); },
        null
      );
    } else {
      _doSaveCats(cleaned, removedIds);
    }
  }
  window.saveCatEditor = saveCatEditor;

  function _doSaveCats(cleaned, removedIds) {
    uiShowLoading('保存中...');
    dbSalonSaveMenuCategories(cleaned, function (ok) {
      if (!ok) {
        uiForceHideLoading();
        uiToast('カテゴリの保存に失敗しました');
        return;
      }
      // 削除カテゴリのメニューを 'other' へ付け替え
      var targets = [];
      var i;
      for (i = 0; i < removedIds.length; i++) {
        var rid = removedIds[i];
        var j;
        for (j = 0; j < _all.length; j++) {
          var m = _all[j];
          if (m && m.type !== 'option' && m.category === rid) {
            targets.push(m._id);
          }
        }
      }
      if (targets.length === 0) {
        uiForceHideLoading();
        uiToast('カテゴリを保存しました');
        closeCatEditor();
        loadList();
        return;
      }
      var done = 0, err = 0;
      for (i = 0; i < targets.length; i++) {
        dbSalonUpdateMenu(targets[i], { category: 'other' }, function (r) {
          if (!r) { err++; }
          done++;
          if (done >= targets.length) {
            uiForceHideLoading();
            if (err > 0) {
              uiToast('一部のメニューの移動に失敗しました。画面を更新してください');
            } else {
              uiToast('カテゴリを保存しました');
            }
            closeCatEditor();
            loadList();
          }
        });
      }
    });
  }

  document.getElementById('catPanelOv').onclick = function (e) {
    if (e.target === this) { closeCatEditor(); }
  };

  // ============================================================
  // ★2026/9 画像からメニュー取り込み
  //   ボタン→画像選択→callable(extractMenusFromImage)→確認/編集→まとめて作成
  // ============================================================
  var _impItems = []; // [{name,price,duration,categoryId,description,type,include}]

  function openImportPicker() {
    var el = document.getElementById('importFileIn');
    if (el) { el.value = ''; el.click(); }
  }
  window.openImportPicker = openImportPicker;

  (function () {
    var fin = document.getElementById('importFileIn');
    if (!fin) { return; }
    fin.onchange = function () {
      var files = fin.files;
      if (!files || files.length === 0) { return; }
      if (files.length > 4) { uiToast('画像は最大4枚までです'); return; }
      _readImagesThenExtract(files);
    };
  })();

  function _readImagesThenExtract(files) {
    uiShowLoading('画像を読み込み中...');
    var out = [];
    var total = files.length;
    var done = 0;
    var failed = false;
    function onOne() {
      done++;
      if (done >= total) {
        if (failed) { uiForceHideLoading(); uiToast('画像の読み込みに失敗しました'); return; }
        _callExtract(out);
      }
    }
    var i;
    for (i = 0; i < total; i++) {
      (function (file) {
        var reader = new FileReader();
        reader.onload = function () {
          var res = String(reader.result || '');
          var comma = res.indexOf(',');
          var meta = (comma >= 0) ? res.slice(0, comma) : '';
          var b64 = (comma >= 0) ? res.slice(comma + 1) : res;
          var mt = 'image/png';
          var m = meta.match(/data:([^;]+);/);
          if (m) { mt = m[1]; }
          out.push({ mediaType: mt, data: b64 });
          onOne();
        };
        reader.onerror = function () { failed = true; onOne(); };
        reader.readAsDataURL(file);
      })(files[i]);
    }
  }

  function _callExtract(images) {
    uiShowLoading('AIがメニューを読み取っています...');
    var catNames = [];
    var i;
    for (i = 0; i < _cats.length; i++) { catNames.push(_cats[i].name); }
    var fn = firebase.app().functions('asia-northeast1')
      .httpsCallable('extractMenusFromImage');
    fn({ images: images, categories: catNames }).then(function (res) {
      uiForceHideLoading();
      var d = (res && res.data) ? res.data : null;
      if (!d || !d.ok) {
        var emsg = (d && d.message) ? d.message : '読み取りに失敗しました';
        if (d && d.detail) { emsg += '（詳細: ' + d.detail + '）'; }
        uiToast(emsg);
        return;
      }
      if (!d.items || d.items.length === 0) {
        uiToast('メニューを検出できませんでした');
        return;
      }
      _prepImportItems(d.items);
      renderImport();
      document.getElementById('importPanelOv').className = 'panel-ov show';
    }).catch(function (e) {
      uiForceHideLoading();
      uiToast('読み取りに失敗しました: ' + (e && e.message ? e.message : ''));
    });
  }

  // カテゴリ名 → 既存カテゴリID（一致しなければ 'other'）
  function _resolveCatId(name) {
    if (!name) { return 'other'; }
    var t = String(name).trim().toLowerCase();
    var i;
    for (i = 0; i < _cats.length; i++) {
      if (String(_cats[i].name).trim().toLowerCase() === t) { return _cats[i].id; }
    }
    return 'other';
  }

  function _prepImportItems(items) {
    _impItems = [];
    var i;
    for (i = 0; i < items.length; i++) {
      var it = items[i] || {};
      _impItems.push({
        name: it.name || '',
        price: (typeof it.price === 'number') ? it.price : null,
        duration: (typeof it.duration === 'number') ? it.duration : null,
        categoryId: it.category ? _resolveCatId(it.category) : 'other',
        description: it.description || '',
        type: (it.type === 'option') ? 'option' : 'main',
        include: true
      });
    }
  }

  function _impCatOptionsHtml(selId) {
    var h = '';
    var i;
    for (i = 0; i < _cats.length; i++) {
      h += '<option value="' + esc(_cats[i].id) + '"'
        + (selId === _cats[i].id ? ' selected' : '') + '>'
        + esc(_cats[i].name) + '</option>';
    }
    h += '<option value="other"'
      + ((selId === 'other' || !selId) ? ' selected' : '') + '>'
      + esc(OTHER_CAT.label) + '</option>';
    return h;
  }

  function renderImport() {
    var body = document.getElementById('importBody');
    var h = '';
    h += '<div class="form-note">AIが読み取った内容です。<b>必ず確認・修正してから</b>取り込んでください。'
       + '取り込んだメニューは<b>最初は非公開</b>で登録されます（内容を確認してから公開に切り替えてください）。'
       + '所要時間が空欄の行は取り込めません（下の一括設定でまとめて埋められます）。</div>';

    h += '<div class="imp-bulk">'
       + '<div class="team-section-title">空欄の一括設定</div>'
       + '<div class="imp-grid">'
       +   '<div class="field"><label>所要時間（分）</label>'
       +     '<input type="number" id="impDefDur" value="60" inputmode="numeric"></div>'
       +   '<div class="field"><label>料金（円）</label>'
       +     '<input type="number" id="impDefPrice" value="0" inputmode="numeric"></div>'
       +   '<div class="field"><label>カテゴリ</label>'
       +     '<select id="impDefCat">' + _impCatOptionsHtml('other') + '</select></div>'
       + '</div>'
       + '<button class="btn-cat" onclick="applyImportBulk()">空欄に一括適用</button>'
       + '</div>';

    var i;
    for (i = 0; i < _impItems.length; i++) {
      var it = _impItems[i];
      h += '<div class="imp-item' + (it.include ? '' : ' off') + '" id="impItem_' + i + '">';
      h += '<div class="imp-item-head">'
         + '<input type="checkbox" id="impInc_' + i + '"' + (it.include ? ' checked' : '')
         +   ' onchange="toggleImportInc(' + i + ')">'
         + '<input class="imp-name" id="impName_' + i + '" type="text" value="' + esc(it.name)
         +   '" placeholder="メニュー名（必須）">'
         + '</div>';
      h += '<div class="imp-grid">'
         + '<div class="field"><label>種別</label><select id="impType_' + i + '">'
         +   '<option value="main"' + (it.type === 'main' ? ' selected' : '') + '>メイン</option>'
         +   '<option value="option"' + (it.type === 'option' ? ' selected' : '') + '>オプション</option>'
         + '</select></div>'
         + '<div class="field"><label>カテゴリ</label><select id="impCat_' + i + '">'
         +   _impCatOptionsHtml(it.categoryId) + '</select></div>'
         + '<div class="field"><label>所要時間（分）</label>'
         +   '<input type="number" id="impDur_' + i + '" value="'
         +   (it.duration != null ? it.duration : '') + '" inputmode="numeric"></div>'
         + '<div class="field"><label>料金（円）</label>'
         +   '<input type="number" id="impPrice_' + i + '" value="'
         +   (it.price != null ? it.price : '') + '" inputmode="numeric"></div>'
         + '</div>';
      h += '<div class="field"><label>説明（任意）</label><textarea id="impDesc_' + i + '">'
         + esc(it.description) + '</textarea></div>';
      h += '</div>';
    }
    body.innerHTML = h;
  }

  function _syncImportFromDom() {
    var i;
    for (i = 0; i < _impItems.length; i++) {
      var nEl = document.getElementById('impName_' + i);
      if (nEl) { _impItems[i].name = String(nEl.value || '').trim(); }
      var tEl = document.getElementById('impType_' + i);
      if (tEl) { _impItems[i].type = (tEl.value === 'option') ? 'option' : 'main'; }
      var cEl = document.getElementById('impCat_' + i);
      if (cEl) { _impItems[i].categoryId = cEl.value; }
      var dEl = document.getElementById('impDur_' + i);
      if (dEl) {
        var dv = String(dEl.value || '').trim();
        var dn = (dv === '') ? null : parseInt(dv, 10);
        _impItems[i].duration = (dn != null && !isNaN(dn) && dn > 0) ? dn : null;
      }
      var pEl = document.getElementById('impPrice_' + i);
      if (pEl) {
        var pv = String(pEl.value || '').trim();
        var pn = (pv === '') ? null : parseInt(pv, 10);
        _impItems[i].price = (pn != null && !isNaN(pn) && pn >= 0) ? pn : null;
      }
      var descEl = document.getElementById('impDesc_' + i);
      if (descEl) { _impItems[i].description = String(descEl.value || ''); }
      var incEl = document.getElementById('impInc_' + i);
      if (incEl) { _impItems[i].include = !!incEl.checked; }
    }
  }

  function toggleImportInc(i) {
    _syncImportFromDom();
    renderImport();
  }
  window.toggleImportInc = toggleImportInc;

  function applyImportBulk() {
    _syncImportFromDom();
    var dd = document.getElementById('impDefDur');
    var dp = document.getElementById('impDefPrice');
    var dc = document.getElementById('impDefCat');
    var defDur = dd ? parseInt(dd.value, 10) : NaN;
    var defPrice = dp ? parseInt(dp.value, 10) : NaN;
    var defCat = dc ? dc.value : 'other';
    var i;
    for (i = 0; i < _impItems.length; i++) {
      if (_impItems[i].duration == null && !isNaN(defDur) && defDur > 0) {
        _impItems[i].duration = defDur;
      }
      if (_impItems[i].price == null && !isNaN(defPrice) && defPrice >= 0) {
        _impItems[i].price = defPrice;
      }
      if (_impItems[i].categoryId === 'other' || !_impItems[i].categoryId) {
        _impItems[i].categoryId = defCat;
      }
    }
    renderImport();
    uiToast('空欄にデフォルトを適用しました');
  }
  window.applyImportBulk = applyImportBulk;

  function doImport() {
    _syncImportFromDom();
    var selected = [];
    var skipped = 0;
    var i;
    for (i = 0; i < _impItems.length; i++) {
      var it = _impItems[i];
      if (!it.include) { continue; }
      if (!it.name || it.duration == null || it.duration <= 0) { skipped++; continue; }
      selected.push(it);
    }
    if (selected.length === 0) {
      uiToast('取り込める行がありません（メニュー名と所要時間が必要です）');
      return;
    }
    // sortOrder の起点（type別に現在の最大値）
    var maxMain = -1, maxOpt = -1;
    for (i = 0; i < _all.length; i++) {
      var so = (typeof _all[i].sortOrder === 'number') ? _all[i].sortOrder : -1;
      if (_all[i].type === 'option') { if (so > maxOpt) { maxOpt = so; } }
      else { if (so > maxMain) { maxMain = so; } }
    }

    uiShowLoading('取り込み中...');
    var total = selected.length;
    var err = 0;

    function next(idx) {
      if (idx >= total) {
        uiForceHideLoading();
        var okCount = total - err;
        var msg = (okCount > 0) ? (okCount + '件を取り込みました（非公開）') : '取り込みに失敗しました';
        if (err > 0) { msg += ' / ' + err + '件失敗'; }
        if (skipped > 0) { msg += ' / ' + skipped + '件スキップ'; }
        uiToast(msg);
        closeImport();
        loadList();
        return;
      }
      var it = selected[idx];
      var so;
      if (it.type === 'option') { maxOpt += 1; so = maxOpt; }
      else { maxMain += 1; so = maxMain; }
      var d = {
        name: it.name,
        duration: it.duration,
        price: (it.price == null ? 0 : it.price),
        type: it.type,
        public: false,
        description: it.description || '',
        sortOrder: so
      };
      if (it.type === 'main') { d.category = it.categoryId || 'other'; }
      dbSalonCreateMenu(d, function (res) {
        if (!res || !res._id) { err++; }
        next(idx + 1);
      });
    }
    next(0);
  }
  window.doImport = doImport;

  function closeImport() {
    document.getElementById('importPanelOv').className = 'panel-ov';
    _impItems = [];
  }
  window.closeImport = closeImport;

  document.getElementById('importPanelOv').onclick = function (e) {
    if (e.target === this) { closeImport(); }
  };

  onFbReady(function () {
    requireSalonStaff(function (isStaff) {
      if (!isStaff) {
        window.location.href = 'salon_auth_v2_new.html';
        return;
      }
      var user = firebase.auth().currentUser;
      _salonId = user ? user.uid : null;
      if (!_salonId) {
        window.location.href = 'salon_auth_v2_new.html';
        return;
      }
      loadList();
    });
  });

})();
</script>
